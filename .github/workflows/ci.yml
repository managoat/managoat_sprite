name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28.1'
          elixir-version: '1.19.2'
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp28-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix check
      - run: python3 -m unittest discover -s test -p '*_test.py' -v
      - run: sh -n install.sh scripts/build-release.sh
      - run: sh scripts/build-release.sh
