name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28.1'
          elixir-version: '1.19.2'
      - run: mix deps.get
      - run: python3 -m venv .venv-a2a && .venv-a2a/bin/pip install -r test/fixtures/a2a/requirements.txt
      - run: mix check
      - run: python3 -m unittest discover -s test -p '*_test.py' -v
      - run: sh scripts/build-release.sh
      - name: Verify packaged runtime and tag version
        run: |
          release_dir=$(mktemp -d)
          trap 'rm -rf "$release_dir"' EXIT
          (cd dist && sha256sum -c *.sha256)
          tar -xzf dist/managoat-linux-*.tar.gz -C "$release_dir"
          test "$(cat "$release_dir/VERSION")" = "${GITHUB_REF_NAME#v}"
          "$release_dir/bin/managoat" eval 'IO.puts("Packaged runtime ready")'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.runner }}
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Stage draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --draft --title "Managoat Sprite $GITHUB_REF_NAME" --notes-file docs/release-notes.md
