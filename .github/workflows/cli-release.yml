name: CLI Release
on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing CLI tag to verify and stage
        required: true
        type: string
env:
  CLI_TAG: ${{ inputs.release_tag || github.ref_name }}
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        runner: [ubuntu-24.04, macos-14]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CLI_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: test "$(cat scripts/CLI_VERSION)" = "${CLI_TAG#cli-v}"
      - name: Test host commands on supported Python versions
        run: |
          python3 -m unittest discover -s test -p 'chat_test.py' -v
          python3 -m unittest discover -s test -p 'provision_test.py' -v
          python3 -m unittest discover -s test -p 'cli_release_test.py' -v
      - run: sh -n install-cli.sh
      - run: python3 scripts/build-cli.py
      - name: Install the packaged CLI
        run: |
          prefix=$(mktemp -d)
          trap 'rm -rf "$prefix"' EXIT
          MANASPRITES_ARCHIVE="$PWD/dist/cli/manasprites.tar.gz" sh dist/cli/install-cli.sh --prefix "$prefix"
          test "$("$prefix/bin/manasprites" --version)" = "manasprites ${CLI_TAG#cli-v}"
          "$prefix/bin/manasprites" prompt --help
          "$prefix/bin/manasprites" sprite create --help
      - uses: actions/upload-artifact@v4
        if: matrix.runner == 'ubuntu-24.04' && matrix.python == '3.13'
        with:
          name: cli-release
          path: dist/cli/*
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CLI_TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: cli-release
          path: dist/cli
      - name: Stage draft CLI release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$CLI_TAG" dist/cli/* --verify-tag --draft --prerelease --title "Manasprites ${CLI_TAG#cli-v} (preview)" --notes-file docs/cli-release-notes.md
